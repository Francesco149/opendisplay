name: Linux

# The Rust workspace in linux/ (protocol crates, fake sender, and later the
# Linux receiver and sender) is built natively on both architectures it
# targets. Cross-compiling is deliberately not attempted: the moment
# GStreamer / libva enter the link it stops being worth it, and arm64
# hosted runners are free for public repositories.
on:
  pull_request:
    paths:
      - "linux/**"
      - "PROTOCOL.md"
      - ".github/workflows/linux.yml"
  push:
    branches: [main]
    paths:
      - "linux/**"
      - "PROTOCOL.md"
      - ".github/workflows/linux.yml"

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    name: rust (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v6

      # Build-time: GStreamer core/base/app/video headers and libwayland for
      # od-receiver; FFmpeg headers plus libclang (bindgen) for od-sender.
      # Run-time: a software H.264 decoder so the fake-sender -> receiver
      # test exercises real decode (into fakesink) on the runner.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libclang-dev \
            libpipewire-0.3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes the fake-sender end-to-end run over a real TCP socket against
      # a ReceiverSession null sink: the protocol conformance check.
      - name: Test
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --workspace --release

  # The AUR package, built the way an Arch/Omarchy user's AUR helper builds it
  # (SENDER-PLAN §4.3 row 1, step 8), from this checkout instead of the tag.
  # Arch rather than Ubuntu: it is the package's target, and its sway (>= 1.10,
  # ext-image-copy-capture) hosts the headless smoke test below. x86_64 only:
  # archlinux:latest has no arm64 image.
  arch-package:
    name: arch package (x86_64)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      # git before checkout, or actions/checkout falls back to a tarball and
      # from-checkout.sh has nothing to `git archive`.
      - name: Install base tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git namcap
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder

      - uses: actions/checkout@v6

      - name: makepkg opendisplay-sender
        run: |
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd linux/packaging/arch/opendisplay-sender
          sudo -u builder ./from-checkout.sh --syncdeps --noconfirm

      - name: Inspect package
        working-directory: linux/packaging/arch/opendisplay-sender
        run: |
          pkg="$(ls opendisplay-sender-[0-9]*.pkg.tar.*)"
          pacman -Qlp "$pkg"
          namcap PKGBUILD "$pkg"
          # .SRCINFO is what the AUR shows; it must match the PKGBUILD.
          sudo -u builder makepkg --printsrcinfo | diff -u .SRCINFO -

      # The packaged /usr/bin/od-sender on a headless Sway (wlroots, pixman,
      # no GPU): adopt and wlroots backends, capture, input placement, a full
      # stream into od-receiver --sink none, crash recovery with `clean`.
      # See linux/testbench/sway-smoke.sh.
      - name: Install package and Sway
        working-directory: linux/packaging/arch/opendisplay-sender
        run: |
          pacman -U --noconfirm opendisplay-sender-[0-9]*.pkg.tar.*
          pacman -S --noconfirm --needed sway foot wlr-randr jq libcap
          # Executing /usr/bin/sway in this container failed with "Operation
          # not permitted" (#298): a file capability outside Docker's default
          # set. A plain copy carries none; the smoke step puts it first.
          getcap /usr/bin/sway || true
          install -m755 /usr/bin/sway /usr/local/bin/sway

      # The far end for the streaming step: no GStreamer needed for --sink
      # none. Cargo is still installed from makepkg's makedepends.
      - name: Build od-receiver (null sink)
        run: |
          sudo -u builder -H cargo build --locked --release \
            --manifest-path linux/Cargo.toml -p od-receiver --no-default-features

      - name: Sway headless smoke
        run: |
          install -d -o builder "$RUNNER_TEMP/sway-smoke"
          sudo -u builder -H env LANG=C.UTF-8 PATH=/usr/local/bin:/usr/bin \
            OD_RECEIVER="$GITHUB_WORKSPACE/linux/target/release/od-receiver" \
            timeout 180 linux/testbench/sway-smoke.sh /usr/bin/od-sender "$RUNNER_TEMP/sway-smoke"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sway-smoke-logs
          path: ${{ runner.temp }}/sway-smoke
          if-no-files-found: ignore

  # The KDE backend on a headless KWin (SENDER-PLAN §4.3 KWin row):
  # zkde_screencast virtual outputs, PipeWire frames, fake input, a stream
  # into od-receiver --sink none. KWin's virtual backend composites with
  # OpenGL only on a DRM render node; hosted runners have no GPU, so the vgem
  # module provides one for Mesa's software renderer (green since
  # 2026-10-20; a runner kernel without vgem fails it).
  kde-smoke:
    name: kde smoke (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Render node (vgem)
        run: |
          sudo modprobe vgem || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe vgem
          }
          ls -l /dev/dri

      - name: KDE smoke in an Arch container
        run: |
          mkdir -p "$RUNNER_TEMP/kde-smoke"
          docker run --rm --device /dev/dri \
            -v "$PWD:/src" -v "$RUNNER_TEMP/kde-smoke:/logs" \
            archlinux:latest bash /src/linux/testbench/kde-ci-container.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kde-smoke-logs
          path: ${{ runner.temp }}/kde-smoke
          if-no-files-found: ignore

  # GNOME backend: a headless Mutter with its own session bus, PipeWire and
  # WirePlumber. No GPU or render node needed (Mesa's surfaceless platform;
  # verified with /dev/dri hidden). Virtual monitor
  # over Mutter's ScreenCast/RemoteDesktop D-Bus APIs, PipeWire frames,
  # pointer input, scale/position, cleanup after kill -9. The run happens
  # under strace and fails if anything reaches the system bus. Experimental
  # until a run proves it. See linux/testbench/gnome-smoke.sh.
  gnome-smoke:
    name: gnome smoke (x86_64, experimental)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: GNOME smoke in an Arch container
        run: |
          mkdir -p "$RUNNER_TEMP/gnome-smoke"
          docker run --rm \
            -v "$PWD:/src" -v "$RUNNER_TEMP/gnome-smoke:/logs" \
            archlinux:latest bash /src/linux/testbench/gnome-ci-container.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnome-smoke-logs
          path: ${{ runner.temp }}/gnome-smoke
          if-no-files-found: ignore
