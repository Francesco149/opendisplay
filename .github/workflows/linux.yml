name: Linux

# The Rust workspace in linux/ (protocol crates, fake sender, and later the
# Linux receiver and sender) is built natively on both architectures it
# targets. Cross-compiling is deliberately not attempted: the moment
# GStreamer / libva enter the link it stops being worth it, and arm64
# hosted runners are free for public repositories.
on:
  pull_request:
    paths:
      - "linux/**"
      - "PROTOCOL.md"
      - ".github/workflows/linux.yml"
  push:
    branches: [main]
    paths:
      - "linux/**"
      - "PROTOCOL.md"
      - ".github/workflows/linux.yml"

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    name: rust (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v6

      # Build-time: GStreamer core/base/app/video headers and libwayland for
      # od-receiver; FFmpeg headers plus libclang (bindgen) for od-sender.
      # Run-time: a software H.264 decoder so the fake-sender -> receiver
      # test exercises real decode (into fakesink) on the runner.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes the fake-sender end-to-end run over a real TCP socket against
      # a ReceiverSession null sink: the protocol conformance check.
      - name: Test
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --workspace --release

  # The AUR package, built the way an Arch/Omarchy user's AUR helper builds it
  # (SENDER-PLAN §4.3 row 1, step 8), from this checkout instead of the tag.
  # Arch rather than Ubuntu: it is the package's target, and its sway (>= 1.10,
  # ext-image-copy-capture) hosts the headless smoke test below. x86_64 only:
  # archlinux:latest has no arm64 image.
  arch-package:
    name: arch package (x86_64)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      # git before checkout, or actions/checkout falls back to a tarball and
      # from-checkout.sh has nothing to `git archive`.
      - name: Install base tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git namcap
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder

      - uses: actions/checkout@v6

      - name: makepkg opendisplay-sender
        run: |
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd linux/packaging/arch/opendisplay-sender
          sudo -u builder ./from-checkout.sh --syncdeps --noconfirm

      - name: Inspect package
        working-directory: linux/packaging/arch/opendisplay-sender
        run: |
          pkg="$(ls opendisplay-sender-[0-9]*.pkg.tar.*)"
          pacman -Qlp "$pkg"
          namcap PKGBUILD "$pkg"
          # .SRCINFO is what the AUR shows; it must match the PKGBUILD.
          sudo -u builder makepkg --printsrcinfo | diff -u .SRCINFO -

      # TODO(SENDER-PLAN step 8): headless sway smoke against the package.
      #   pacman -S sway; WLR_BACKENDS=headless WLR_RENDERER=pixman
      #   WLR_LIBINPUT_NO_DEVICES=1 dbus-run-session sway -c ci.conf &
      #   swaymsg create_output; swaymsg output HEADLESS-2 mode --custom 640x480@60Hz
      #   od-receiver --listen 127.0.0.1:9100 --sink none &   (from the workspace)
      #   timeout 60 /usr/bin/od-sender dev smoke --output HEADLESS-2 \
      #     --connect 127.0.0.1:9100 --size 640x480 --frames 30
      # and upload both logs. Waits for `od-sender dev smoke` (step 1).
