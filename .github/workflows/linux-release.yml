name: Linux release

# Linux sender releases are cut by hand, by pushing a `linux-v*` tag:
#   git tag linux-v0.1.0-beta.1 && git push origin linux-v0.1.0-beta.1
# They stay out of release-please (release.yml runs on pushes to main and owns
# the plain `v*` tags; it ignores `linux-`-prefixed tags as another
# component's), so a Linux release never triggers a Mac/iOS build and an app
# release never ships Linux binaries. See linux/SENDER-PLAN.md §8.1.
#
# The release is never marked "Latest": the website's Mac download buttons
# resolve releases/latest/download/OpenDisplay.dmg.
#
# The binaries link a minimal static FFmpeg and x264 built by
# linux/packaging/ffmpeg/build-static.sh, so they run on any glibc distro
# whatever its FFmpeg (SENDER-PLAN §3.5 option C). Pull requests touching that
# script or this file, and manual runs, build and smoke-test without releasing.
on:
  push:
    tags: ["linux-v*"]
  # Anything that can break the static link or the tarball: the FFmpeg
  # build, the packaging scripts, the lockfile and the crates od-sender links.
  pull_request:
    paths:
      - "linux/packaging/ffmpeg/**"
      - "linux/packaging/flatpak/**"
      - "linux/packaging/tarball/**"
      - "linux/packaging/*.sh"
      - "linux/packaging/*.py"
      - "linux/Cargo.*"
      - "linux/crates/od-sender/**"
      - "linux/crates/opendisplay-proto/**"
      - "linux/crates/opendisplay-session/**"
      - "linux/crates/od-receiver/**"
      - ".github/workflows/linux-release.yml"
  workflow_dispatch:

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc_floor: the newest glibc the binary may hard-require, as the
          # release notes promise. Ubuntu 24.04 has 2.39; on x86_64 the 2.39
          # need (Rust std's pidfd_spawnp/pidfd_getpid) is WEAK and the hard
          # floor is 2.38 (C23 __isoc23_* from FFmpeg/OpenH264); the aarch64
          # link marks the same need non-weak, so aarch64 needs 2.39.
          - runner: ubuntu-24.04
            arch: x86_64
            glibc_floor: "2.38"
          - runner: ubuntu-24.04-arm
            arch: aarch64
            glibc_floor: "2.39"
    name: od-sender (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # A cold static FFmpeg build is the long part (~10 min).
    timeout-minutes: 60
    defaults:
      run:
        working-directory: linux
    env:
      TAG: ${{ github.ref_name }}
      # Fixed path: build-static.sh bakes it into rustflags, and the cache
      # restores it here.
      FFMPEG_DIR: /home/runner/static-ffmpeg
    steps:
      - uses: actions/checkout@v6

      # No FFmpeg or x264 packages: the static build brings its own, and their
      # absence keeps the system ones out of the link. libclang for bindgen,
      # nasm for x264's, FFmpeg's and OpenH264's x86 assembly.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev nasm libpipewire-0.3-dev

      - uses: dtolnay/rust-toolchain@stable

      # linux-v0.1.0-beta.1 must belong to crate version 0.1.0, and
      # `od-sender --version` names the release it came from.
      - name: Version
        run: |
          crate="$(cargo pkgid -p od-sender | sed 's/.*[#@]//')"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "VERSION=${crate}-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            echo "OD_SENDER_VERSION=${crate}-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            exit 0
          fi
          ver="${TAG#linux-v}"
          if [ "${ver%%-*}" != "$crate" ]; then
            echo "::error::tag $TAG does not match od-sender version $crate"
            exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          # Read by build.rs: `od-sender --version` and `doctor` print it.
          echo "OD_SENDER_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Cache static FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: static-ffmpeg-${{ matrix.arch }}-${{ hashFiles('linux/packaging/ffmpeg/build-static.sh') }}

      - name: Build static FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: packaging/ffmpeg/build-static.sh "$FFMPEG_DIR"

      - name: Link against static FFmpeg
        run: echo "RUSTFLAGS=$(cat "$FFMPEG_DIR/rustflags")" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --locked --release -p od-sender

      - name: Build
        run: cargo build --locked --release -p od-sender

      # Only glibc, libgcc, libstdc++ (OpenH264 is C++) and libpipewire (KDE
      # backend; its 0.3 soname has been stable since 2020) may be NEEDED; an
      # FFmpeg or x264 soname here means the static link silently fell back.
      - name: Check dynamic dependencies
        run: |
          bin=target/release/od-sender
          readelf -d "$bin" | grep NEEDED
          bad="$(readelf -d "$bin" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' |
            grep -Ev '^(libc|libm|libpthread|libdl|librt)\.so\.[0-9]+$|^libgcc_s\.so\.1$|^libstdc\+\+\.so\.6$|^libpipewire-0\.3\.so\.0$|^ld-linux-(x86-64|aarch64)\.so\.[0-9]+$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::unexpected shared libraries: $bad"
            exit 1
          fi
          # The promised floors (release notes): fail on a newer hard need.
          packaging/check-symbol-floor.sh "$bin" "${{ matrix.glibc_floor }}" 3.4.32

      # Nothing here touches a compositor: the version, then each software
      # encoder on synthetic frames. `auto` also proves h264_v4l2m2m is
      # compiled in (it is tried first and falls back on a runner).
      - name: Smoke test
        run: |
          bin=target/release/od-sender
          [ "$("$bin" --version)" = "od-sender $VERSION" ] || {
            echo "::error::--version says '$("$bin" --version)', want od-sender $VERSION"; exit 1; }
          for enc in x264 openh264 auto; do
            "$bin" dev encode-bench --encoder "$enc" --width 640 --height 480 --frames 30
          done

      - name: Package
        run: |
          name="od-sender-${VERSION}-${{ matrix.arch }}-unknown-linux-gnu"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage" "$RUNNER_TEMP/dist"
          install -m755 target/release/od-sender packaging/tarball/install.sh "$stage/"
          install -m644 packaging/arch/opendisplay-sender/od-sender.desktop \
                        packaging/arch/opendisplay-sender/od-sender@.service \
                        ../LICENSE ../PROTOCOL.md "$stage/"
          # FFmpeg and x264 (from the static prefix), OpenH264, and every
          # Rust crate linked in, with their licence texts.
          python3 -I packaging/third-party-licenses.py . "$FFMPEG_DIR" > "$stage/THIRD-PARTY-LICENSES.txt"
          # Reproducible: fixed owner, order and timestamps (the commit's).
          mtime="$(git log -1 --format=%ct)"
          tar -C "$RUNNER_TEMP" --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@${mtime}" -cf - "$name" | gzip -n > "$RUNNER_TEMP/dist/$name.tar.gz"
          (cd "$RUNNER_TEMP/dist" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          tar -tzvf "$RUNNER_TEMP/dist/$name.tar.gz"
          cat "$RUNNER_TEMP/dist/$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: od-sender-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  # The receiver as a Flatpak bundle: the install path for read-only systems
  # (SteamOS, the Steam Frame) and anything without GTK 4 / GStreamer.
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    name: od-receiver flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      # Pinned by SHA: its bundles are release attachments.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: od-receiver-${{ matrix.arch }}.flatpak
          manifest-path: linux/packaging/flatpak/app.opendisplay.Receiver.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('linux/Cargo.lock') }}

  release:
    needs: [build, flatpak]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The one job that can write to the repository: actions pinned by SHA.
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: linux/packaging/ffmpeg

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      # The tarballs bring their checksums from the build job; the Flatpak
      # bundles get theirs here, so every attachment has one.
      - name: Checksum Flatpak bundles
        working-directory: dist
        run: for f in ./*.flatpak; do sha256sum "${f#./}" > "${f}.sha256"; done

      - name: Verify checksums
        working-directory: dist
        run: |
          ls -l
          ls ./*.tar.gz ./*.flatpak >/dev/null
          sha256sum -c ./*.sha256

      # The AUR package builds from GitHub's tag tarball; its checksum goes
      # into the notes so bump.sh's result can be cross-checked.
      - name: Write release notes
        run: |
          set -o pipefail  # a failed download must not hash to e3b0c442…
          ver="${TAG#linux-v}"
          script=linux/packaging/ffmpeg/build-static.sh
          ffmpeg_tag="$(sed -n 's/^FFMPEG_TAG=//p' "$script")"
          x264_commit="$(sed -n 's/^X264_COMMIT=\([0-9a-f]*\).*/\1/p' "$script")"
          src_sha="$(curl -fsSL "https://github.com/${GH_REPO}/archive/refs/tags/${TAG}.tar.gz" | sha256sum | cut -d' ' -f1)"
          cat > notes.md <<EOF
          Linux sender (\`od-sender\`) ${ver}, beta. Wayland only; tested on Omarchy / Hyprland 0.55+.

          **Arch Linux / Omarchy:** \`yay -S opendisplay-sender\` (AUR; builds against your system FFmpeg and gets updates through your AUR helper).

          **Any other distribution:** the tarballs below run on x86_64 Linux with glibc 2.38 or newer (Ubuntu 24.04, Debian 13, Fedora 39 and later) and on aarch64 Linux with glibc 2.39 or newer (Ubuntu 24.04, Debian 13, Fedora 40 and later). FFmpeg ${ffmpeg_tag} and x264 are linked in statically with only the H.264 encoders the sender uses, so no FFmpeg install is needed; PipeWire (\`libpipewire-0.3\`, present on any current desktop) must be installed. Unpack and run \`./install.sh\` (into \`~/.local\`; \`sudo ./install.sh --system\` for \`/usr/local\`): it installs \`od-sender\`, a desktop entry and a \`systemd --user\` template unit pointing at it. Then run \`od-sender run\`. Each tarball also has the license (GPL-3.0; this build includes GPL x264), \`THIRD-PARTY-LICENSES.txt\` (FFmpeg, x264, OpenH264 and the Rust crates linked in) and \`PROTOCOL.md\`.

          **Receiver (\`od-receiver\`), any distribution incl. SteamOS:** \`flatpak install --user od-receiver-<arch>.flatpak\`, then start "OpenDisplay Receiver". It fills the screen when a sender connects.

          Linked-in sources: FFmpeg [${ffmpeg_tag}](https://github.com/FFmpeg/FFmpeg/tree/${ffmpeg_tag}) and x264 [${x264_commit:0:7}](https://code.videolan.org/videolan/x264/-/tree/${x264_commit}), configured by [\`build-static.sh\`](https://github.com/${GH_REPO}/blob/${TAG}/${script}).

          Source tarball sha256 (AUR): \`${src_sha}\`
          EOF
          cat notes.md

      # Always a pre-release while the sender is in beta; never "Latest".
      - name: Create pre-release
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 dist/*.flatpak \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "Linux sender ${TAG#linux-v}" \
            --notes-file notes.md
